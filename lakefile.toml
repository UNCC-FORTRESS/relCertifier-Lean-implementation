name = "relCertifier-lean-implementation"
version = "0.1.0"
defaultTargets = ["RelCertifier"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

# dL-rel (path) transitively provides dL-lean v0.1.0-DI (Stages 1-2: Term/Formula/DI)
# AND the Stage-3 global ∀∃ encoding bridge (RFormula.encoding_correct). One require
# avoids a double dL-lean; matches the old dL-relcertifier wiring.
[[require]]
name = "dL-rel"
path = "../dL-rel"

[[lean_lib]]
name = "RelCertifier"

[[lean_exe]]
name = "relcert"
root = "Main"

[[lean_exe]]
name = "relcert-test"
root = "Test"
